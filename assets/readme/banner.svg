  <text id="tagline" x="64" y="218" xml:space="preserve" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#c9d1d9"><tspan>answers questions from a</tspan><tspan> local corpus</tspan><tspan> by combining keyword search</tspan><tspan> with dense embedding search</tspan></text>
  <g id="terminal" font-family="ui-monospace, Consolas, monospace" font-size="22">
    <text x="64" y="262" xml:space="preserve"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> uv run mini-rag query "Who won the 1998 football World Cup?"</tspan></text>
    <text x="64" y="294" xml:space="preserve" fill="#8b949e">1. [nuclear_safety_and_security#82]  dense 0.502  bm25 14.754  fused 0.0313</text>
    <text x="64" y="326" fill="#e6edf3">Answer:</text>
    <text x="64" y="358" fill="#d29922">Not found in the corpus.</text>
    <text x="64" y="390" fill="#8b949e">found: no, written by a model: no</text>
    <text x="64" y="422" fill="#3fb950">$</text>
