# mini-rag configuration. These values reproduce the included Wikipedia example.
# Command-line options override this file; keys left out fall back to the built-in defaults.

[corpus]
dir = "data/corpus"            # folder holding the documents, one file each
extensions = [".txt"]          # file types to read; add ".md" to read Markdown files too

[chunking]
size = 500                     # characters per chunk
overlap = 100                  # characters shared by neighbouring chunks

[embedder]
kind = "fastembed"             # "fastembed" or "custom"
model = "BAAI/bge-small-en-v1.5"  # a model name fastembed supports

[index]
dir = ".cache/index"           # where ingest saves the index that query loads

[retrieval]
top_k = 5                      # fused hits returned per question
rrf_k = 60                     # constant k of reciprocal rank fusion
bm25_weight = 1.0              # weight of the keyword ranking in the fusion
dense_weight = 1.0             # weight of the embedding ranking in the fusion

[gate]
threshold = 0.55               # lowest best dense score that counts as found; belongs to the embedder above

[generator]
kind = "none"                  # "none", "anthropic", "openai_compatible" or "custom"; only used with --generate
model = ""                     # model name sent to the generator; required for "anthropic" and "openai_compatible"

# To let a model write the answer, replace the two lines above with one of these blocks.
#
# Anthropic API; run uv sync --extra llm and set ANTHROPIC_API_KEY in the session first:
# kind = "anthropic"
# model = "<model name from your provider>"
#
# A server that accepts chat-completions requests:
# kind = "openai_compatible"
# model = "<model name from your provider>"
# base_url = "http://localhost:8080/v1"
# api_key_env = "<name of the variable holding the key; leave this line out for a server without a key>"
#
# A Generator subclass of your own; [generator.options] holds its keyword arguments:
# kind = "custom"
# class = "package.module:ClassName"

[eval]
questions = "eval/questions.json"  # question set used by eval, eval-check and calibrate
sizes = [500, 1000]            # chunk sizes compared by eval
cache_dir = ".cache/eval"      # where eval and calibrate keep their embedded chunks
